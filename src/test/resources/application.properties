spring.application.name=Scriptum-test

# ---------------------------------------------------------------------------
# This file lives on the test classpath, which precedes the main classpath,
# so it shadows src/main/resources/application.properties for every test.
# No @ActiveProfiles annotation is needed and no test can accidentally pick
# up the real datasource or the real mail credentials.
# ---------------------------------------------------------------------------

# In-memory H2 in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:scriptum;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Fake mail settings. JavaMailSender is autoconfigured but never connects;
# tests that exercise EmailService mock it out.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.invalid
spring.mail.password=not-a-real-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Test-only signing key. HS256 via Keys.hmacShaKeyFor needs at least 32 bytes.
jwt.secret=test-secret-key-for-unit-tests-only-do-not-use-in-production-0123456789
jwt.expiration=86400000

verification.token.expiry.minutes=1440

logging.level.org.springframework.security=warn
logging.level.org.hibernate.SQL=warn
