spring.application.name=Scriptum

# ---------------------------------------------------------------------------
# Configuration is read from the environment. Nothing secret belongs in this
# file: it is committed, so anything written here is public to everyone with
# repository access, and stays recoverable from git history afterwards.
#
# Local development (the values docker-compose.yml already provides):
#   DB_URL=jdbc:postgresql://localhost:5432/auth_db
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgres
#
# Required in every environment that sends mail or issues tokens:
#   MAIL_USERNAME=...        the sending account
#   MAIL_PASSWORD=...        its app password
#   JWT_SECRET=...           at least 32 bytes; HS256 rejects anything shorter
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.show-actuator=false

# No default: an unset JWT_SECRET fails at startup rather than signing every
# token in production with a value published in this file.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

verification.token.expiry.minutes=${VERIFICATION_TOKEN_EXPIRY_MINUTES:1440}

# `trace` prints credentials, tokens and filter internals on every request.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:info}
