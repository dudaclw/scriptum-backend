name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify` runs the whole lifecycle: compile, test, package, then the
      # JaCoCo gate. The executable jar is in target/ once this step finishes,
      # so nothing needs packaging again later.
      - name: Build, test and check coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Summarise coverage
        if: always()
        run: |
          report=target/site/jacoco/jacoco.csv
          if [ ! -f "$report" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          line_min=$(sed -n 's|.*<jacoco.line.minimum>\(.*\)</jacoco.line.minimum>.*|\1|p' pom.xml)
          branch_min=$(sed -n 's|.*<jacoco.branch.minimum>\(.*\)</jacoco.branch.minimum>.*|\1|p' pom.xml)

          # jacoco.csv columns:
          #  1 GROUP               2 PACKAGE             3 CLASS
          #  4 INSTRUCTION_MISSED  5 INSTRUCTION_COVERED
          #  6 BRANCH_MISSED       7 BRANCH_COVERED
          #  8 LINE_MISSED         9 LINE_COVERED
          # 10 COMPLEXITY_MISSED  11 COMPLEXITY_COVERED
          # 12 METHOD_MISSED      13 METHOD_COVERED
          {
            echo "## Coverage"
            echo
            awk -F, '
              function pct(c, m) {
                return (c + m) == 0 ? "n/a" : sprintf("%.1f%%", 100 * c / (c + m))
              }
              NR > 1 {
                im += $4;  ic += $5
                bm += $6;  bc += $7
                lm += $8;  lc += $9
                mm += $12; mc += $13
              }
              END {
                print "| Metric | Covered | Missed | Coverage |"
                print "|---|---|---|---|"
                printf "| Lines | %d | %d | **%s** |\n", lc, lm, pct(lc, lm)
                printf "| Branches | %d | %d | **%s** |\n", bc, bm, pct(bc, bm)
                printf "| Instructions | %d | %d | %s |\n", ic, im, pct(ic, im)
                printf "| Methods | %d | %d | %s |\n", mc, mm, pct(mc, mm)
              }
            ' "$report"

            if [ -n "$line_min" ] && [ -n "$branch_min" ]; then
              echo
              echo "Lines and branches are the gated metrics: \`jacoco:check\` fails" \
                   "the build below $line_min and $branch_min respectively."
            fi

            echo
            echo "<details><summary>Per package</summary>"
            echo
            echo "| Package | Lines | Branches |"
            echo "|---|---|---|"
            # Aggregated in awk, then sorted by the shell: the runner's awk is
            # mawk, which has no asorti.
            awk -F, '
              function pct(c, m) {
                return (c + m) == 0 ? "n/a" : sprintf("%.1f%%", 100 * c / (c + m))
              }
              NR > 1 {
                pkg = $2
                sub(/^com\.scriptum\.backend\.?/, "", pkg)
                if (pkg == "") pkg = "(root)"
                bmiss[pkg] += $6; bcov[pkg] += $7
                lmiss[pkg] += $8; lcov[pkg] += $9
                seen[pkg] = 1
              }
              END {
                for (pkg in seen) {
                  printf "| `%s` | %s | %s |\n", pkg,
                         pct(lcov[pkg], lmiss[pkg]), pct(bcov[pkg], bmiss[pkg])
                }
              }
            ' "$report" | sort

            echo
            echo "</details>"
            echo
            echo "POJOs generated by Lombok, the bootstrap class and the unused" \
                 "AuthService are excluded; see the jacoco plugin config in pom.xml."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded even on failure: a red build is exactly when the reports matter.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      # The jar `verify` already produced. Skipped automatically when an earlier
      # step failed, since there would be nothing worth uploading.
      - name: Upload the application jar
        uses: actions/upload-artifact@v5
        with:
          name: scriptum-backend-jar
          path: target/*.jar
          retention-days: 7
