name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and check coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Summarise coverage
        if: always()
        run: |
          report=target/site/jacoco/jacoco.csv
          if [ ! -f "$report" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 {
            lm += $4; lc += $5; bm += $6; bc += $7
          } END {
            printf "## Coverage\n\n"
            printf "| Metric | Covered | Missed | Percentage |\n"
            printf "|---|---|---|---|\n"
            printf "| Lines | %d | %d | %.1f%% |\n", lc, lm, 100 * lc / (lc + lm)
            printf "| Branches | %d | %d | %.1f%% |\n", bc, bm, 100 * bc / (bc + bm)
          }' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Package the application jar
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload the application jar
        uses: actions/upload-artifact@v4
        with:
          name: scriptum-backend-jar
          path: target/*.jar
          retention-days: 7
